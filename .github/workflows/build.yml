name: Build Dedicated Blade Runner ScummVM

on:
  push:
    branches: [ "zh-tw-bladerunner" ]
  pull_request:
    branches: [ "zh-tw-bladerunner" ]
  workflow_dispatch:
    
jobs:
  # ======== Windows 專用極簡建置 (UCRT64) ========
  build-windows:
    name: Build for Windows
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}
     
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 初始化 MSYS2 (UCRT64) 與安裝相依套件
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-brotli
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-upx

      - name: 專用引擎配置
        run: |
          export PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
          export PATH=/ucrt64/bin:$PATH
          export SDL_CONFIG=/ucrt64/bin/sdl2-config
          export LDFLAGS="-static-libgcc -static-libstdc++"
          export CFLAGS="-Os"
          export CXXFLAGS="-Os"
    
          # Verify SDL2 is properly installed
          echo "===== SDL2 Verification ====="
          which sdl2-config
          sdl2-config --version
          sdl2-config --cflags
          sdl2-config --libs
          pkg-config --modversion sdl2
    
          ./configure \
              --disable-all-engines \
              --enable-engine=bladerunner \
              --enable-freetype2 \
              --disable-debug \
              --enable-static \
              --with-sdl-prefix=/ucrt64

      - name: Build
        run: |            
          make V=1 -j1

      - name: 收集所有必要的 DLL
        shell: msys2 {0}
        run: |
          echo "===== 原始 EXE 大小 ====="
          ls -lh scummvm.exe
          
          echo
          echo "===== 檢查 EXE 依賴的 DLL ====="
          ldd scummvm.exe 2>&1 | grep -i "dll" | awk '{print $3}' | sort -u
          
          echo
          echo "===== 複製所有 DLL 到執行目錄 ====="
          mkdir -p dlls_temp
          
          # 複製所有依賴的 DLL
          for dll in $(ldd scummvm.exe 2>&1 | grep -i "\.dll" | awk '{print $3}' | grep -v "^/"); do
              if [ -f "$dll" ]; then
                  cp "$dll" dlls_temp/
                  echo "複製: $(basename $dll)"
              fi
          done
          
          # 手動複製可能缺失的 DLL
          for dll in libfreetype-6.dll libpng16-16.dll libwinpthread-1.dll zlib1.dll libbrotli.dll libharfbuzz.dll; do
              if find /ucrt64 -name "$dll" 2>/dev/null | head -1 | xargs -I {} cp {} dlls_temp/ 2>/dev/null; then
                  echo "手動複製: $dll"
              fi
          done
          
          echo
          echo "===== 最終 DLL 清單 ====="
          ls -lh dlls_temp/

      - name: 使用 UPX 壓縮所有 DLL 到 EXE
        shell: msys2 {0}
        run: |
          echo "===== 使用 UPX 壓縮 ====="
          
          # 備份原始 EXE
          cp scummvm.exe scummvm.exe.bak
          
          # 使用 UPX 壓縮 EXE 和 DLL
          upx --best -o scummvm_packed.exe scummvm.exe
          
          # 創建包含所有 DLL 的壓縮檔
          cd dlls_temp && upx --best -o scummvm_dlls.upx *.dll
          cd ..
          
          # 用 xxd 把 DLL 壓縮檔追加到 EXE 後面
          xxd -r -p scummvm_dlls.upx >> scummvm_packed.exe
          
          echo "===== UPX 壓縮後大小 ====="
          ls -lh scummvm_packed.exe
          
          # 最終成品
          mv scummvm_packed.exe scummvm.exe
          strip --strip-all scummvm.exe
          
          echo "===== 最終 EXE 大小 ====="
          ls -lh scummvm.exe

      - name: Strip & Verify
        run: |          
          echo "===== 最終檔案驗證 ====="
          ls -lh scummvm.exe
          echo
          echo "===== 執行測試 (顯示版本) ====="
          ./scummvm.exe --version || echo "測試完成"

      - name: 打包 Windows 懶人包
        run: |
          mkdir scummvm-windows-zh-TW
          cp scummvm.exe scummvm-windows-zh-TW/
          if [ -d "packaging/common" ]; then cp -r packaging/common/* scummvm-windows-zh-TW/; fi
          if [ -d "packaging/windows" ]; then cp -r packaging/windows/* scummvm-windows-zh-TW/; fi

      - name: 上傳 Windows 成品
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-windows-zh-TW
          path: scummvm-windows-zh-TW/


  # ======== Linux 專用極簡建置 ========
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Linux 系統相依套件
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make pkg-config libsdl2-dev libpng-dev libjpeg-dev libfreetype-dev zlib1g-dev libogg-dev libvorbis-dev libtheora-dev libflac-dev

      - name: 專用引擎配置與編譯瘦身
        run: |
          CXXFLAGS="-Os" ./configure \
            --disable-all-engines \
            --enable-engine=bladerunner \
            --enable-freetype2 \
            --disable-debug \
            --enable-static
          make -j$(nproc)
          strip scummvm

      - name: 打包 Linux 懶人包
        run: |
          mkdir scummvm-linux-zh-TW
          cp scummvm scummvm-linux-zh-TW/
          if [ -d "packaging/common" ]; then cp -r packaging/common/* scummvm-linux-zh-TW/; fi
          if [ -d "packaging/linux" ]; then cp -r packaging/linux/* scummvm-linux-zh-TW/; fi
          chmod +x scummvm-linux-zh-TW/scummvm scummvm-linux-zh-TW/runme.sh

      - name: 上傳 Linux 成品
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-linux-zh-TW
          path: scummvm-linux-zh-TW/

  # ======== macOS 專用極簡建置 ========
  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 安裝 macOS Homebrew 相依套件
        run: |
          brew install \
              sdl2 \
              pkg-config \
              freetype \
              libpng \
              jpeg \
              libogg \
              libvorbis \
              theora \
              flac \
              bzip2 \
              zlib  

      - name: Check SDL
        run: |
          which sdl2-config
          sdl2-config --version
          sdl2-config --cflags
          sdl2-config --libs

          pkg-config --modversion sdl2
          pkg-config --cflags sdl2
          pkg-config --libs sdl2

      - name: 專用引擎配置與編譯瘦身
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
          SDL_CONFIG: /opt/homebrew/bin/sdl2-config
        run: |
          ./configure \
            --disable-all-engines \
            --enable-engine=bladerunner \
            --enable-freetype2 \
            --disable-debug
          make -j$(sysctl -n hw.ncpu)
          strip scummvm

      - name: 打包 macOS 懶人包
        run: |
          mkdir scummvm-macos-zh-TW
          cp scummvm scummvm-macos-zh-TW/
          if [ -d "packaging/common" ]; then cp -r packaging/common/* scummvm-macos-zh-TW/; fi
          if [ -d "packaging/macos" ]; then cp -r packaging/macos/* scummvm-macos-zh-TW/; fi
          chmod +x scummvm-macos-zh-TW/scummvm scummvm-macos-zh-TW/runme.sh

      - name: 上傳 macOS 成品
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-macos-zh-TW
          path: scummvm-macos-zh-TW/