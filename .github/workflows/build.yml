name: Build Dedicated Blade Runner ScummVM

on:
  push:
    branches: [ "zh-tw-bladerunner" ]
  pull_request:
    branches: [ "zh-tw-bladerunner" ]
  workflow_dispatch:
    
jobs:
  # ======== Windows 專用極簡建置 (UCRT64) ========
  build-windows:
    name: Build for Windows
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}
     
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 初始化 MSYS2 (UCRT64) 與安裝相依套件
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-brotli
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-zlib

      - name: 獲取靜態連結所需的庫
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
          
          echo "===== 獲取 freetype2 的靜態連結標誌 ====="
          pkg-config --static --libs freetype2
          
          echo
          echo "===== 獲取 harfbuzz 的靜態連結標誌 ====="
          pkg-config --static --libs harfbuzz
          
          echo
          echo "===== 所有靜態庫與依賴 ====="
          STATIC_LIBS=$(pkg-config --static --libs freetype2 harfbuzz)
          echo "$STATIC_LIBS"

      - name: 專用引擎配置
        run: |
          export PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
          export PATH=/ucrt64/bin:$PATH
          export SDL_CONFIG=/ucrt64/bin/sdl2-config
          export LDFLAGS="-static-libgcc -static-libstdc++"
          export CFLAGS="-Os"
          export CXXFLAGS="-Os"
    
          # Verify SDL2 is properly installed
          echo "===== SDL2 Verification ====="
          which sdl2-config
          sdl2-config --version
          sdl2-config --cflags
          sdl2-config --libs
          pkg-config --modversion sdl2
    
          ./configure \
              --disable-all-engines \
              --enable-engine=bladerunner \
              --enable-freetype2 \
              --disable-debug \
              --enable-static \
              --with-sdl-prefix=/ucrt64

      - name: 修改 config.mk 以使用靜態連結
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
          
          echo "===== 原始 LIBS 設定 ====="
          grep "^LIBS" config.mk | head -1
          
          echo
          echo "===== 備份並獲取靜態庫標誌 ====="
          cp config.mk config.mk.bak
          
          # 使用 pkg-config 獲取完整的靜態連結標誌
          STATIC_FREETYPE=$(pkg-config --static --libs freetype2)
          STATIC_HARFBUZZ=$(pkg-config --static --libs harfbuzz)
          
          echo "FreeType2 靜態標誌: $STATIC_FREETYPE"
          echo "HarfBuzz 靜態標誌: $STATIC_HARFBUZZ"
          
          # 使用 awk 修改，移除舊的 -lfreetype, -lharfbuzz 等，加入完整的靜態標誌
          awk -v ft="$STATIC_FREETYPE" -v hb="$STATIC_HARFBUZZ" '
          /^LIBS/ {
              # 移除舊的單個庫標誌
              gsub(/ -lpng[0-9]* /, " ")
              gsub(/ -lz /, " ")
              gsub(/ -lfreetype /, " ")
              gsub(/ -lbrotli[^ ]*/, "")
              gsub(/ -lharfbuzz /, " ")
              gsub(/ -lgraphite2 /, " ")
              gsub(/ -lbz2 /, " ")
              
              # 在末尾加入完整的靜態連結標誌
              $0 = $0 " " ft " " hb " -lbz2 -luuid -ldwrite"
              print
              next
          }
          { print }
          ' config.mk > config.mk.tmp && mv config.mk.tmp config.mk
          
          echo
          echo "===== 修改後的 LIBS 設定 ====="
          grep "^LIBS" config.mk | head -1

      - name: Debug config.mk
        shell: msys2 {0}
        run: |
          echo "===== config.mk LIBS 行 ====="
          grep "^LIBS" config.mk | head -c 300
          echo ""

      - name: Build
        run: |            
          make V=1 -j1

      - name: Verify linking
        shell: msys2 {0}
        run: |
          echo "===== 檢查執行檔依賴 ====="
          ldd scummvm.exe 2>&1 | grep -E "dll|not found" || echo "無外部 DLL 依賴"
          echo
          echo "===== 執行檔大小 ====="
          ls -lh scummvm.exe
          echo
          echo "===== 詳細檢查：查詢 DLL 依賴 ====="
          objdump -p scummvm.exe 2>&1 | grep "DLL Name" || echo "無外部 DLL 依賴"

      - name: Strip & Optimize
        run: |          
          strip --strip-all --remove-section=.comment scummvm.exe
          echo "===== Strip 後大小 ====="
          ls -lh scummvm.exe

      - name: 打包 Windows 懶人包
        run: |
          mkdir scummvm-windows-zh-TW
          cp scummvm.exe scummvm-windows-zh-TW/
          if [ -d "packaging/common" ]; then cp -r packaging/common/* scummvm-windows-zh-TW/; fi
          if [ -d "packaging/windows" ]; then cp -r packaging/windows/* scummvm-windows-zh-TW/; fi

      - name: 上傳 Windows 成品
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-windows-zh-TW
          path: scummvm-windows-zh-TW/


  # ======== Linux 專用極簡建置 ========
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Linux 系統相依套件
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make pkg-config libsdl2-dev libpng-dev libjpeg-dev libfreetype-dev zlib1g-dev libogg-dev libvorbis-dev libtheora-dev libflac-dev

      - name: 專用引擎配置與編譯瘦身
        run: |
          CXXFLAGS="-Os" ./configure \
            --disable-all-engines \
            --enable-engine=bladerunner \
            --enable-freetype2 \
            --disable-debug \
            --enable-static
          make -j$(nproc)
          strip scummvm

      - name: 打包 Linux 懶人包
        run: |
          mkdir scummvm-linux-zh-TW
          cp scummvm scummvm-linux-zh-TW/
          if [ -d "packaging/common" ]; then cp -r packaging/common/* scummvm-linux-zh-TW/; fi
          if [ -d "packaging/linux" ]; then cp -r packaging/linux/* scummvm-linux-zh-TW/; fi
          chmod +x scummvm-linux-zh-TW/scummvm scummvm-linux-zh-TW/runme.sh

      - name: 上傳 Linux 成品
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-linux-zh-TW
          path: scummvm-linux-zh-TW/

  # ======== macOS 專用極簡建置 ========
  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 安裝 macOS Homebrew 相依套件
        run: |
          brew install \
              sdl2 \
              pkg-config \
              freetype \
              libpng \
              jpeg \
              libogg \
              libvorbis \
              theora \
              flac \
              bzip2 \
              zlib  

      - name: Check SDL
        run: |
          which sdl2-config
          sdl2-config --version
          sdl2-config --cflags
          sdl2-config --libs

          pkg-config --modversion sdl2
          pkg-config --cflags sdl2
          pkg-config --libs sdl2

      - name: 專用引擎配置與編譯瘦身
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
          SDL_CONFIG: /opt/homebrew/bin/sdl2-config
        run: |
          ./configure \
            --disable-all-engines \
            --enable-engine=bladerunner \
            --enable-freetype2 \
            --disable-debug
          make -j$(sysctl -n hw.ncpu)
          strip scummvm

      - name: 打包 macOS 懶人包
        run: |
          mkdir scummvm-macos-zh-TW
          cp scummvm scummvm-macos-zh-TW/
          if [ -d "packaging/common" ]; then cp -r packaging/common/* scummvm-macos-zh-TW/; fi
          if [ -d "packaging/macos" ]; then cp -r packaging/macos/* scummvm-macos-zh-TW/; fi
          chmod +x scummvm-macos-zh-TW/scummvm scummvm-macos-zh-TW/runme.sh

      - name: 上傳 macOS 成品
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-macos-zh-TW
          path: scummvm-macos-zh-TW/