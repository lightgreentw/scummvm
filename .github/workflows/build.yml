name: Build Dedicated Blade Runner ScummVM

on:
  push:
    branches: [ "zh-tw-bladerunner" ]
  pull_request:
    branches: [ "zh-tw-bladerunner" ]
  workflow_dispatch:

jobs:
  # ======== Windows 專用極簡建置 ========
  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 初始化 MSYS2 與安裝相依套件
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make mingw-w64-x86_64-toolchain mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2 mingw-w64-x86_64-libpng mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-freetype mingw-w64-x86_64-zlib mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libvorbis mingw-w64-x86_64-libtheora mingw-w64-x86_64-flac

      - name: 專用引擎配置與靜態編譯
        run: |
          ./configure \
            --disable-all-engines \
            --enable-engine=bladerunner \
            --enable-freetype2 \
            --disable-debug \
            --enable-static \
            --extra-cflags="-Os" \
            --extra-ldflags="-static"
          make -j$(nproc)
          strip scummvm.exe

      - name: 打包 Windows 懶人包
        run: |
          mkdir scummvm-windows-zh-TW
          cp scummvm.exe scummvm-windows-zh-TW/
          if [ -d "packaging/common" ]; then cp -r packaging/common/* scummvm-windows-zh-TW/; fi
          if [ -d "packaging/windows" ]; then cp -r packaging/windows/* scummvm-windows-zh-TW/; fi

      - name: 上傳 Windows 成品
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-windows-zh-TW
          path: scummvm-windows-zh-TW/

  # ======== Linux 專用極簡建置 ========
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Linux 系統相依套件
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make pkg-config libsdl2-dev libpng-dev libjpeg-dev libfreetype-dev zlib1g-dev libogg-dev libvorbis-dev libtheora-dev libflac-dev

      - name: 專用引擎配置與編譯瘦身
        run: |
          ./configure \
            --disable-all-engines \
            --enable-engine=bladerunner \
            --enable-freetype2 \
            --disable-debug \
            --enable-static \
            --extra-cflags="-Os"
          make -j$(nproc)
          strip scummvm

      - name: 打包 Linux 懶人包
        run: |
          mkdir scummvm-linux-zh-TW
          cp scummvm scummvm-linux-zh-TW/
          if [ -d "packaging/common" ]; then cp -r packaging/common/* scummvm-linux-zh-TW/; fi
          if [ -d "packaging/linux" ]; then cp -r packaging/linux/* scummvm-linux-zh-TW/; fi
          chmod +x scummvm-linux-zh-TW/scummvm scummvm-linux-zh-TW/runme.sh

      - name: 上傳 Linux 成品
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-linux-zh-TW
          path: scummvm-linux-zh-TW/

  # ======== macOS 專用極簡建置 ========
  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 安裝 macOS Homebrew 相依套件
        run: |
          brew install sdl2 libpng jpeg freetype flac libogg libvorbis libtheora pkg-config

      - name: 專用引擎配置與編譯瘦身
        run: |
          ./configure \
            --disable-all-engines \
            --enable-engine=bladerunner \
            --enable-freetype2 \
            --disable-debug \
            --enable-static \
            --extra-cflags="-Os"
          make -j$(sysctl -n hw.ncpu)
          strip scummvm

      - name: 打包 macOS 懶人包
        run: |
          mkdir scummvm-macos-zh-TW
          cp scummvm scummvm-macos-zh-TW/
          if [ -d "packaging/common" ]; then cp -r packaging/common/* scummvm-macos-zh-TW/; fi
          if [ -d "packaging/macos" ]; then cp -r packaging/macos/* scummvm-macos-zh-TW/; fi
          chmod +x scummvm-macos-zh-TW/scummvm scummvm-macos-zh-TW/runme.sh

      - name: 上傳 macOS 成品
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-macos-zh-TW
          path: scummvm-macos-zh-TW/